<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大观园 · 水墨卧游</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e7dcc4;
    font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;user-select:none;color:#2b241a;}
  .hidden{display:none !important;}

  /* ---------- 总览地图 ---------- */
  #mapView{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;padding:4px 0;
    background:radial-gradient(120% 100% at 50% 20%, #fbf7ec 0%, #efe6d2 60%, #e3d5b8 100%);}
  #mapWrap{position:relative;width:min(96vw,calc(74vh * 0.6974));aspect-ratio:848/1216;
    box-shadow:0 18px 50px rgba(60,40,15,.28);border:1px solid rgba(120,90,50,.35);border-radius:4px;overflow:hidden;}
  #mapImg{width:100%;height:100%;object-fit:contain;display:block;}
  #mapSpots{position:absolute;inset:0;}
  .mapspot{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;}
  .mapspot i{display:block;width:13px;height:13px;margin:0 auto;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#d8665a,#a8322a);
    box-shadow:0 0 0 4px rgba(168,50,42,.16),0 2px 6px rgba(0,0,0,.3);border:1.5px solid #faf2e2;}
  .mapspot span{display:inline-block;margin-top:5px;padding:2px 7px;font-size:13px;letter-spacing:2px;
    white-space:nowrap;background:linear-gradient(180deg,rgba(250,246,235,.94),rgba(238,229,208,.92));
    border:1px solid rgba(120,90,50,.4);border-radius:3px;box-shadow:0 2px 6px rgba(60,40,20,.22);}
  .mapspot:hover span{background:linear-gradient(180deg,#fbe6c8,#f2d3a0);border-color:#b98a3a;}
  .maptitle{font-size:24px;letter-spacing:6px;display:flex;align-items:center;gap:10px;}
  .maptitle .seal{display:grid;place-items:center;width:28px;height:28px;border-radius:5px;background:#a8322a;
    color:#fff6ea;font-size:15px;box-shadow:0 2px 8px rgba(120,20,10,.4);}
  .maphint{font-size:13px;letter-spacing:2px;color:#6a5c44;}

  /* ---------- 场景 ---------- */
  #stages{position:fixed;inset:0;overflow:hidden;}
  .scene{position:absolute;inset:0;overflow:hidden;isolation:isolate;
    background:radial-gradient(130% 110% at 50% 18%, #fdfaf0 0%, #f3ebd7 55%, #e6d8ba 100%);
    transition:transform .82s cubic-bezier(.6,.02,.2,1), opacity .6s ease;}
  .scene.on{transform:translateX(0);opacity:1;z-index:2;}
  .scene.left{transform:translateX(-100%);opacity:.35;z-index:1;}
  .scene.right{transform:translateX(100%);opacity:.35;z-index:1;}

  :root{--farimg:__FARIMG__;}
  .layer{position:absolute;left:-16%;top:-16%;width:132%;height:132%;
    background-repeat:no-repeat;background-position:center;background-size:cover;
    mix-blend-mode:multiply;will-change:transform;backface-visibility:hidden;}
  .layer.far{background-image:var(--farimg);}
  .mist{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:.4;
    background:radial-gradient(50% 40% at 30% 60%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
               radial-gradient(45% 35% at 75% 45%, rgba(255,255,255,.4), rgba(255,255,255,0) 70%);}

  .spot{position:absolute;left:50%;top:56%;z-index:9;transform:translate(-50%,-50%);
    cursor:pointer;text-align:center;}
  .spot .ping{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
    border:2px solid rgba(168,50,42,.6);animation:rp 2.4s ease-out infinite;}
  .spot .dot{display:block;width:12px;height:12px;margin:0 auto;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#d8665a,#a8322a);box-shadow:0 0 0 3px rgba(168,50,42,.18);}
  .spot .tag{display:inline-block;margin-top:7px;padding:3px 8px;font-size:14px;letter-spacing:2px;
    background:linear-gradient(180deg,rgba(250,246,235,.95),rgba(240,231,210,.92));
    border:1px solid rgba(120,90,50,.4);border-radius:4px;box-shadow:0 2px 8px rgba(60,40,20,.25);}
  @keyframes rp{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}

  #tintSeason,#tintTime{position:fixed;inset:0;pointer-events:none;transition:background .8s;}
  #tintSeason{z-index:3;}
  #tintTime{z-index:4;}
  #fx{position:fixed;inset:0;z-index:5;pointer-events:none;}
  .vign{position:fixed;inset:0;z-index:6;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 45%, rgba(255,250,235,0) 55%, rgba(90,70,40,.24) 100%);}

  .hud{position:fixed;left:0;right:0;top:0;z-index:20;padding:14px 16px;display:flex;align-items:center;gap:10px;
    pointer-events:none;background:linear-gradient(180deg,rgba(253,250,240,.9),rgba(253,250,240,0));}
  .hud .seal{display:grid;place-items:center;width:28px;height:28px;border-radius:5px;background:#a8322a;
    color:#fff6ea;font-size:15px;box-shadow:0 2px 8px rgba(120,20,10,.4);}
  .hud .t{font-size:20px;letter-spacing:4px;color:#2b241a;text-shadow:0 1px 0 #fff;flex:1;}
  .hud button{font-family:inherit;font-size:13.5px;letter-spacing:2px;cursor:pointer;
    padding:6px 13px;border-radius:18px;color:#4a3f2c;background:linear-gradient(180deg,rgba(250,246,235,.96),rgba(238,229,208,.94));
    border:1px solid rgba(120,90,50,.4);box-shadow:0 2px 8px rgba(60,40,20,.18);pointer-events:auto;}
  .hud #back{color:#fff6ea;background:linear-gradient(180deg,#c0473a,#a8322a);border:none;}
  .hudright{display:flex;gap:6px;pointer-events:auto;}

  .hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;font-size:12.5px;letter-spacing:1.4px;
    color:#5a4f3c;background:rgba(250,245,232,.82);border:1px solid rgba(120,90,50,.28);border-radius:16px;padding:6px 15px;white-space:nowrap;}

  .prompt{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:22;display:flex;align-items:center;gap:12px;
    padding:8px 12px 8px 20px;background:linear-gradient(180deg,rgba(250,246,235,.98),rgba(240,231,210,.97));
    border:1px solid rgba(120,90,50,.4);border-radius:30px;box-shadow:0 6px 20px rgba(50,30,10,.28);}
  .prompt #pname{font-size:18px;letter-spacing:3px;}
  .prompt button{font-family:inherit;font-size:14px;letter-spacing:2px;cursor:pointer;padding:7px 18px;color:#fff6ea;
    background:linear-gradient(180deg,#c0473a,#a8322a);border:none;border-radius:22px;box-shadow:0 3px 10px rgba(140,30,20,.4);}

  .modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(30,22,10,.42);backdrop-filter:blur(3px);}
  .paper{position:relative;width:min(540px,92vw);max-height:86vh;overflow:auto;padding:26px 30px 30px;
    background:linear-gradient(180deg,#fbf6e9,#f2e9d4);border:1px solid rgba(120,90,50,.5);border-radius:8px;
    box-shadow:0 30px 70px rgba(30,15,0,.5), inset 0 0 0 6px rgba(255,252,244,.6);}
  .paper::before{content:"";position:absolute;inset:10px;pointer-events:none;border:1px solid rgba(150,120,70,.28);border-radius:5px;}
  .paper .x{position:absolute;right:12px;top:10px;cursor:pointer;border:none;background:transparent;font-size:18px;color:#7a6a52;}
  .m-title{font-size:30px;letter-spacing:6px;text-align:center;margin:0 0 4px;}
  .m-sub{text-align:center;font-size:14px;color:#7a6a52;letter-spacing:2px;margin-bottom:16px;}
  .m-rule{height:1px;background:linear-gradient(90deg,transparent,rgba(60,50,35,.3),transparent);margin:14px 0;}
  .m-row{margin-bottom:12px;}
  .m-row .k{display:inline-block;min-width:60px;font-size:13px;letter-spacing:2px;color:#fff5ea;background:#a8322a;border-radius:3px;padding:2px 8px;margin-right:10px;vertical-align:middle;}
  .m-row .v{font-size:15.5px;line-height:1.85;}
  .couplet{text-align:center;font-size:16px;line-height:1.9;color:#5c4f38;letter-spacing:1px;}
  .panci{background:rgba(255,252,245,.75);border:1px dashed rgba(150,120,70,.5);border-radius:6px;padding:14px 16px;
    font-size:17px;line-height:2.1;letter-spacing:2px;text-align:center;}
  .charhead{display:flex;gap:16px;align-items:center;margin-bottom:10px;}
  .cimg{width:120px;height:172px;object-fit:contain;background:rgba(255,252,245,.55);border-radius:6px;
    border:1px solid rgba(120,90,50,.35);}
  .cname{font-size:25px;letter-spacing:4px;line-height:1.2;}
  .calias{font-size:13px;color:#7a6a52;letter-spacing:2px;margin-top:5px;}
  .cquote{font-size:14px;color:#3a2f20;margin-top:9px;line-height:1.75;letter-spacing:1px;}

  /* ---------- 知识区 ---------- */
  #kbBtn{position:fixed;right:16px;bottom:16px;z-index:70;font-family:inherit;font-size:14px;letter-spacing:2px;
    cursor:pointer;padding:8px 17px;border-radius:20px;color:#fff6ea;
    background:linear-gradient(180deg,#c0473a,#a8322a);border:none;box-shadow:0 4px 14px rgba(140,30,20,.4);}
  #kb{position:fixed;inset:0;z-index:80;background:rgba(25,18,8,.5);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px;}
  .kbwrap{width:min(760px,96vw);height:min(86vh,900px);display:flex;flex-direction:column;
    background:linear-gradient(180deg,#fbf6e9,#f1e7d1);border:1px solid rgba(120,90,50,.5);border-radius:10px;
    box-shadow:0 30px 80px rgba(20,10,0,.55);overflow:hidden;}
  .kbhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid rgba(120,90,50,.25);}
  .kbhead .seal{display:grid;place-items:center;width:26px;height:26px;border-radius:4px;background:#a8322a;color:#fff6ea;font-size:14px;}
  .kbhead .t{flex:1;font-size:20px;letter-spacing:4px;}
  .kbhead button{font-family:inherit;cursor:pointer;border:none;background:transparent;font-size:18px;color:#7a6a52;}
  .kbtabs{display:flex;gap:8px;padding:12px 18px 8px;flex-wrap:wrap;}
  .kbtabs button{font-family:inherit;cursor:pointer;padding:6px 14px;border-radius:16px;font-size:13.5px;letter-spacing:1.5px;
    border:1px solid rgba(120,90,50,.4);background:rgba(255,252,244,.7);color:#4a3f2c;}
  .kbtabs button.on{background:#a8322a;color:#fff6ea;border-color:#a8322a;}
  #kbsearch{font-family:inherit;margin:0 18px 10px;padding:9px 14px;border-radius:18px;font-size:14px;
    border:1px solid rgba(120,90,50,.35);background:rgba(255,252,245,.85);outline:none;color:#2b241a;}
  #kblist{flex:1;overflow:auto;padding:0 18px 20px;}
  .kbitem{padding:11px 2px;border-bottom:1px solid rgba(150,120,70,.2);}
  .kbitem .h{font-size:16px;letter-spacing:1.5px;color:#2b241a;margin-bottom:5px;}
  .kbitem .x{font-size:15px;line-height:1.95;color:#33291a;white-space:pre-wrap;}
  .kbitem .n{font-size:13.5px;line-height:1.8;color:#5d5140;margin-top:5px;white-space:pre-wrap;}
  .kbitem .tag{display:inline-block;font-size:11.5px;letter-spacing:1px;color:#fff5ea;background:#a8322a;
    border-radius:3px;padding:1px 6px;margin-right:8px;vertical-align:2px;}
  .chcard{display:flex;gap:14px;padding:12px 2px;border-bottom:1px solid rgba(150,120,70,.2);}
  .chcard img{width:92px;height:132px;object-fit:contain;background:rgba(255,252,245,.6);border-radius:5px;
    border:1px solid rgba(120,90,50,.3);flex:0 0 auto;}
  .chbody{flex:1;min-width:0;}
  .ct{font-size:17px;letter-spacing:2px;color:#2b241a;}
  .ct .ca{font-size:12.5px;color:#7a6a52;letter-spacing:1px;margin-left:8px;}
  .cx{font-size:14.5px;line-height:1.85;color:#33291a;margin-top:5px;}
  .cn{font-size:13px;line-height:1.75;color:#5d5140;margin-top:5px;}

  /* ---------- 占花名 ---------- */
  #hq{position:fixed;inset:0;z-index:82;background:rgba(25,18,8,.55);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px;}
  .hqbox{position:relative;width:min(460px,94vw);padding:26px 26px 24px;text-align:center;
    background:linear-gradient(180deg,#fbf6e9,#f0e5cd);border:1px solid rgba(120,90,50,.5);border-radius:10px;
    box-shadow:0 30px 80px rgba(20,10,0,.6);}
  .hqbox .x{position:absolute;right:12px;top:10px;cursor:pointer;border:none;background:transparent;font-size:18px;color:#7a6a52;}
  .hqtitle{font-size:24px;letter-spacing:6px;margin-bottom:4px;}
  .hqsub{font-size:12.5px;color:#7a6a52;letter-spacing:2px;margin-bottom:16px;}
  .tube{position:relative;width:92px;height:150px;margin:0 auto 16px;
    background:linear-gradient(90deg,#8b5a2b,#c08a4a 20%,#e0b178 45%,#b8834a 75%,#7c4d22);
    border-radius:10px 10px 14px 14px;box-shadow:inset 0 -14px 22px rgba(60,30,0,.45),0 8px 18px rgba(60,30,0,.35);
    overflow:hidden;}
  .tube i{position:absolute;bottom:26px;width:7px;height:96px;border-radius:3px 3px 0 0;
    background:linear-gradient(180deg,#f6e7c8,#dcc59a);box-shadow:0 0 0 1px rgba(120,90,50,.25);}
  .tube i:nth-child(1){left:20px;height:104px}
  .tube i:nth-child(2){left:32px;height:88px}
  .tube i:nth-child(3){left:44px;height:110px}
  .tube i:nth-child(4){left:56px;height:92px}
  .tube i:nth-child(5){left:68px;height:100px}
  .tube i::after{content:"";position:absolute;top:0;left:0;right:0;height:12px;background:#a8322a;border-radius:3px 3px 0 0;}
  .tube.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97);}
  @keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-4deg)}90%{transform:rotate(2deg)}}
  #hqdraw{font-family:inherit;font-size:15px;letter-spacing:4px;cursor:pointer;padding:9px 26px;color:#fff6ea;
    background:linear-gradient(180deg,#c0473a,#a8322a);border:none;border-radius:24px;box-shadow:0 4px 14px rgba(140,30,20,.4);}
  .hqresult{margin-top:16px;min-height:10px;}
  .hqflower{font-size:34px;letter-spacing:10px;color:#8f2f26;}
  .hqsign{font-size:14px;letter-spacing:4px;color:#7a6a52;margin-top:4px;}
  .hqline{font-size:19px;letter-spacing:3px;color:#2b241a;margin-top:12px;}
  .hqwho{font-size:15px;letter-spacing:2px;color:#a8322a;margin-top:8px;}
  .hqnote{font-size:13px;line-height:1.85;color:#5d5140;margin-top:10px;text-align:left;
    background:rgba(255,252,245,.6);border-radius:6px;padding:10px 12px;}

  @media (max-width:640px){
    .hint{font-size:10.5px;max-width:94vw;white-space:normal;text-align:center}
    .hud .t{font-size:15px;letter-spacing:2px}
    .hud button{font-size:11.5px;padding:5px 9px;letter-spacing:1px}
    .mapspot span{font-size:11px;letter-spacing:1px;padding:1px 5px}
    .maptitle{font-size:19px;letter-spacing:4px}
  }

  /* ========== 太虚幻境 · 判词册（对开册页 · 覆盖旧卡片版） ========== */
  #uv{position:fixed;inset:0;z-index:84;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:16px;background:radial-gradient(circle at 50% 28%, #2b2620 0%, #141109 72%);}
  .uvtop{position:absolute;top:14px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;}
  .uvt{font-size:17px;letter-spacing:7px;color:#e6d9bd;}
  .uvprog{font-size:12px;letter-spacing:2px;color:#b9a883;border:1px solid rgba(200,180,140,.3);border-radius:12px;padding:2px 9px;}
  #uvclose{position:absolute;right:16px;top:12px;background:transparent;border:none;color:#cbbfa4;font-size:20px;cursor:pointer;}

  .bookwrap{perspective:2400px;perspective-origin:50% 42%;}
  .book{position:relative;width:min(790px,94vw);height:min(62vh,500px);display:flex;
    transform:rotateX(7deg);transform-style:preserve-3d;}
  .half{width:50%;height:100%;position:relative;overflow:hidden;background:linear-gradient(180deg,#faf3e1,#efe3c7);}
  .half::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(90deg, rgba(160,130,80,.05) 0 1px, transparent 1px 4px);}
  .half.left{border-radius:7px 2px 2px 7px;box-shadow:inset 20px 0 34px -20px rgba(120,85,40,.6);}
  .half.right{border-radius:2px 7px 7px 2px;box-shadow:inset -20px 0 34px -20px rgba(120,85,40,.6);}
  .spine{position:absolute;left:50%;top:-3px;bottom:-3px;width:26px;margin-left:-13px;z-index:4;pointer-events:none;
    background:linear-gradient(90deg,rgba(110,75,30,.45),rgba(255,248,232,.5) 42%,rgba(255,248,232,.5) 58%,rgba(110,75,30,.45));
    box-shadow:inset 0 0 14px rgba(90,60,20,.5);}

  .pgc{position:absolute;inset:0;padding:20px 20px 16px;display:flex;flex-direction:column;align-items:center;}
  .pgnum{font-size:11px;letter-spacing:4px;color:#9c8a68;flex:0 0 auto;}
  .paint{flex:1;min-height:0;max-width:100%;object-fit:contain;margin:9px 0 7px;padding:5px;
    border:1px solid rgba(150,120,70,.35);background:#fdfaf1;}
  .pghua{font-size:11.5px;line-height:1.75;color:#6d5f47;text-align:center;flex:0 0 auto;}
  .pgtag{font-size:11px;letter-spacing:4px;color:#9c8a68;flex:0 0 auto;}
  .pgci{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:clamp(14px,2.3vh,19px);line-height:2.05;letter-spacing:2.5px;color:#2a2319;text-align:center;margin:10px 0;}
  .pgseal{flex:0 0 auto;display:inline-block;background:#a8322a;color:#fff6ea;font-size:14.5px;letter-spacing:3px;
    padding:3px 12px;border-radius:3px;box-shadow:0 2px 8px rgba(120,20,10,.35);}
  .pgshi{flex:0 0 auto;font-size:12px;line-height:1.75;color:#5c5040;margin-top:11px;text-align:left;
    border-top:1px dashed rgba(150,120,70,.4);padding-top:8px;}

  .leaf{position:absolute;right:0;top:0;width:50%;height:100%;transform-origin:left center;
    transform-style:preserve-3d;z-index:6;pointer-events:none;opacity:0;
    transition:transform .62s cubic-bezier(.42,.04,.26,1);}
  .leaf.on{opacity:1;}
  .leaf.go{transform:rotateY(-179deg);}
  .lf{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
    background:linear-gradient(180deg,#faf3e1,#efe3c7);}
  .lf.back{transform:rotateY(180deg);}
  .lf.back::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(120,85,40,.28),rgba(255,250,235,0) 45%);}

  .uvnav{display:flex;align-items:center;gap:16px;}
  .uvnav button{font-family:inherit;font-size:13px;letter-spacing:2px;cursor:pointer;padding:7px 17px;border-radius:18px;
    color:#e6d9bd;background:rgba(255,250,235,.08);border:1px solid rgba(200,180,140,.3);}
  .uvnav button:hover{background:rgba(255,250,235,.16);}
  .uvdots{display:flex;gap:6px;max-width:44vw;flex-wrap:wrap;justify-content:center;}
  .uvdots i{width:6px;height:6px;border-radius:50%;background:rgba(232,220,194,.22);cursor:pointer;}
  .uvdots i.ul{background:rgba(216,180,106,.5);}
  .uvdots i.on{background:#e8c87a;transform:scale(1.4);}
  .uvtoast{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:2px;
    color:#f2e4c6;background:rgba(58,44,20,.9);border:1px solid rgba(200,170,110,.5);border-radius:16px;padding:6px 16px;
    opacity:0;transition:opacity .35s;white-space:nowrap;}
  .uvtoast.on{opacity:1;}

  /* ========== 签筒 · 水墨描线版 ========== */
  .tube{position:relative;width:106px;height:160px;margin:0 auto 14px;overflow:visible;}
  .tube .tb{position:absolute;left:12px;right:12px;top:14px;bottom:0;border-radius:7px 7px 15px 15px;
    background:
      repeating-linear-gradient(180deg, rgba(74,58,38,.45) 0 1.4px, rgba(0,0,0,0) 1.4px 42px),
      radial-gradient(120% 65% at 28% 18%, rgba(255,254,246,.95), rgba(236,225,200,.92) 72%),
      #f4ead4;
    border:1.6px solid #4a3a26;
    box-shadow:inset 8px 0 15px -10px rgba(70,50,25,.55), inset -8px 0 15px -10px rgba(70,50,25,.55),
      0 8px 16px rgba(70,45,15,.16);}
  .tube .tb::after{content:"";position:absolute;left:15%;top:9px;bottom:12px;width:8px;border-radius:6px;
    background:linear-gradient(180deg,rgba(255,255,252,.8),rgba(255,255,252,0));}
