name: check

on:
  push:
    branches: [main]
    paths: ['honglou/**']
  pull_request:
    paths: ['honglou/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: honglou
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: honglou/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
